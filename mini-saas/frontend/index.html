<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini SaaS - Clientes</title>

<style>

/* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height:100vh;
    color:#fff;
    padding:30px;
}

/* ===== CONTAINER ===== */
.container{
    max-width:1400px;
    margin:auto;
}

/* ===== HEADER ===== */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    font-size:32px;
    font-weight:700;
}

/* ===== DASHBOARD ===== */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border:1px solid rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h3{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    font-weight:bold;
}

/* ===== MAIN GRID ===== */
.main-grid{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:25px;
}

/* ===== FORM ===== */
form{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:14px;
    height:fit-content;
}

form h2{
    margin-bottom:10px;
}

input, select{
    padding:14px;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    outline:none;
}

input::placeholder{
    color:#cbd5e1;
}

select{
    color:white;
}

option{
    color:black;
}

input:focus,
select:focus{
    border:1px solid #3b82f6;
}

/* ===== BOTÕES ===== */
button{
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

/* ===== CLIENTES ===== */
.clients-area{
    display:flex;
    flex-direction:column;
}

/* ===== FILTROS ===== */
.filters{
    display:flex;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

/* ===== LISTA ===== */
#clientList{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:18px;
}

.client-card{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius:20px;
    padding:20px;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.client-card:hover{
    transform:translateY(-4px);
}

.client-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.client-top h3{
    font-size:20px;
}

/* ===== STATUS ===== */
.status{
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:bold;
}

.ativo{
    background:#22c55e33;
    color:#4ade80;
}

.pendente{
    background:#eab30833;
    color:#fde047;
}

.finalizado{
    background:#3b82f633;
    color:#60a5fa;
}

/* ===== INFO ===== */
.info{
    margin-top:8px;
    color:#cbd5e1;
    font-size:14px;
}

/* ===== PARCELAS ===== */
.installment-box{
    margin-top:15px;
    padding:12px;
    border-radius:14px;
    background: rgba(255,255,255,0.05);
}

.progress{
    width:100%;
    height:10px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    overflow:hidden;
    margin-top:8px;
}

.progress-bar{
    height:100%;
    background:#22c55e;
}

/* ===== MODAL ===== */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    width:350px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.modal-buttons{
    display:flex;
    gap:10px;
}

/* ===== RESPONSIVO ===== */
@media(max-width:1000px){

    .main-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:768px){

    body{
        padding:15px;
    }

    .header h1{
        font-size:24px;
    }

}
/* ===== TOAST ===== */
#toast{

    position:fixed;

    top:20px;
    right:20px;

    background:#22c55e;

    color:white;

    padding:14px 18px;

    border-radius:12px;

    font-weight:bold;

    opacity:0;

    transform:translateY(-20px);

    transition:0.3s;

    z-index:9999;

    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

#toast.show{

    opacity:1;

    transform:translateY(0);
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Mini SaaS Dashboard</h1>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h3>Total de Clientes</h3>
            <p id="totalClients">0</p>
        </div>

        <div class="card">
            <h3>Faturamento Total</h3>
            <p id="totalValue">R$ 0,00</p>
        </div>
    </div>

    <div class="main-grid">

        <!-- FORM -->
        <form id="clientForm">

            <h2>Novo Cliente</h2>

            <input type="text" id="company" placeholder="Nome da empresa" required>
            <input type="text" id="cnpj" placeholder="CNPJ" required>
            <input type="text" id="phone" placeholder="Telefone">
            <input type="text" id="service" placeholder="Serviço">

            <input type="number" id="value" step="0.01">

            <input
                type="number"
                id="installments"
                placeholder="Quantidade de parcelas"
                value="1"
                min="1"
                required
            >

            <select id="status">
                <option value="ativo">Ativo</option>
                <option value="pendente">Pendente</option>
                <option value="finalizado">Finalizado</option>
            </select>

            <button type="submit">Salvar Cliente</button>

        </form>

        <!-- CLIENTES -->
        <div class="clients-area">

            <div class="filters">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Buscar empresa..."
                    oninput="loadClients()"
                >

                <select id="filterStatus" onchange="loadClients()">
                    <option value="">Todos</option>
                    <option value="ativo">Ativo</option>
                    <option value="pendente">Pendente</option>
                    <option value="finalizado">Finalizado</option>
                </select>

            </div>

            <ul id="clientList"></ul>

        </div>

    </div>

</div>
<!-- MODAL EDITAR -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Editar Cliente</h2>

        <input type="hidden" id="editId">

        <input
            type="text"
            id="editCompany"
            placeholder="Empresa"
        >

        <input
            type="text"
            id="editCnpj"
            placeholder="CNPJ"
        >

        <input
            type="text"
            id="editPhone"
            placeholder="Telefone"
        >

        <input
            type="text"
            id="editService"
            placeholder="Serviço"
        >

        <input
            type="number"
            id="editValue"
            placeholder="Valor"
        >

        <input
            type="number"
            id="editInstallments"
            placeholder="Parcelas"
        >

        <input
            type="number"
            id="editPaid"
            placeholder="Parcelas pagas"
        >

        <select id="editStatus">

            <option value="ativo">
                Ativo
            </option>

            <option value="pendente">
                Pendente
            </option>

            <option value="finalizado">
                Finalizado
            </option>

        </select>

        <div class="modal-buttons">

            <button onclick="saveEdit()">
                Salvar
            </button>

            <button
                onclick="closeModal()"
                style="background:#64748b;"
            >
                Cancelar
            </button>

        </div>

    </div>

</div>
<div id="toast"></div>
<script src="script.js"></script>

</body>
</html>
